<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">🧠</div>
      <div>
        <h1>DSA Mentor</h1>
        <p class="subtitle">AI Hint Settings</p>
      </div>
    </div>
    
    <div class="divider"></div>
    
    <div class="form-group">
      <label for="apiKey">Groq API Key</label>
      <div class="input-wrapper">
        <input type="password" id="apiKey" placeholder="gsk_...">
        <button id="toggleVisible" class="icon-btn" title="Toggle visibility">👁️</button>
      </div>
    </div>

    <button id="saveBtn">Save Config</button>
    
    <div id="status"></div>
    
    <div class="divider"></div>
    
    <div class="footer">
      <a href="https://console.groq.com/keys" target="_blank">Get Groq API Key &rarr;</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
