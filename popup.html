<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21M19.5 8.25h-1.5m1.5 3.75h-1.5m1.5 3.75h-1.5M6 8.25H4.5M6 12H4.5M6 15.75H4.5M16.5 7.5h-9A1.5 1.5 0 0 0 6 9v6a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 18 15V9a1.5 1.5 0 0 0-1.5-1.5Z" />
        </svg>
      </div>
      <div>
        <h1>DSA Mentor</h1>
        <p class="subtitle">AI Hint Settings</p>
      </div>
    </div>
    
    <div class="divider"></div>
    
    <div class="form-group">
      <label for="apiKey">Groq API Key</label>
      <div class="input-wrapper">
        <input type="password" id="apiKey" placeholder="gsk_...">
        <button id="toggleVisible" class="icon-btn" title="Toggle visibility" type="button">
          <svg id="eyeOpenIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          <svg id="eyeClosedIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18" style="display: none;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>
    </div>

    <button id="saveBtn">Save Config</button>
    
    <div id="status"></div>
    
    <div class="divider"></div>
    
    <div class="footer">
      <a href="https://console.groq.com/keys" target="_blank">Get Groq API Key &rarr;</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
